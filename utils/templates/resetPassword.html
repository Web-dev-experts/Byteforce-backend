<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password reset</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 0;">
          <table width="100%" style="max-width:520px;background:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td>
                <h2 style="margin:0 0 16px;color:#111;">Reset your password</h2>

                <p style="margin:0 0 24px;color:#555;font-size:15px;line-height:1.6;">
                  We received a request to reset your password.  
                  Use the code below to continue:
                </p>

                <div
                  style="
                    text-align:center;
                    font-size:32px;
                    font-weight:700;
                    letter-spacing:6px;
                    color:#4f46e5;
                    margin:24px 0;
                  "
                >
                  {{code}}
                </div>

                <p style="margin:0 0 16px;color:#777;font-size:13px;">
                  This code expires in <strong>10 minutes</strong>.
                </p>

                <p style="margin:0;color:#999;font-size:12px;">
                  If you didn’t request a password reset, ignore this email.
                </p>
              </td>
            </tr>
          </table>

          <p style="margin-top:16px;color:#aaa;font-size:12px;">
            © Byteforce
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
